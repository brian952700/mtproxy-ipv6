name: Check installer
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash -n install.sh
      - run: shellcheck --severity=warning install.sh
      - run: bash -n tests/ui.sh && shellcheck --severity=warning tests/ui.sh
      - run: bash tests/ui.sh
  official-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        debian: ['12', '13']
    container:
      image: debian:${{ matrix.debian }}
      options: --ulimit nofile=131072:131072 --sysctl net.ipv6.conf.all.disable_ipv6=0
    steps:
      - run: apt-get update && apt-get install -y --no-install-recommends git ca-certificates build-essential libssl-dev zlib1g-dev curl python3 openssl
      - uses: actions/checkout@v4
      - name: Compile official pinned source
        shell: bash
        run: |
          set -euo pipefail
          commit=$(sed -n 's/^UPSTREAM_COMMIT=//p' install.sh)
          git clone --no-checkout https://github.com/TelegramMessenger/MTProxy.git /tmp/official-source
          git -C /tmp/official-source checkout --detach "$commit"
          sed -n '/^patch_ipv6_listener()/,/^}/p' install.sh > /tmp/patch-listener.sh
          source /tmp/patch-listener.sh
          patch_ipv6_listener /tmp/official-source
          make -C /tmp/official-source -j2 CC='gcc -fcommon'
          test -x /tmp/official-source/objs/bin/mtproto-proxy
      - name: Verify IPv6 listener and IPv4 refusal
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/official-source
          curl -fLsS --retry 3 https://core.telegram.org/getProxySecret -o proxy-secret
          curl -fLsS --retry 3 https://core.telegram.org/getProxyConfig -o proxy-multi.conf
          objs/bin/mtproto-proxy -6 -u nobody -p 18888 -H 20443 -S "$(openssl rand -hex 16)" --aes-pwd proxy-secret proxy-multi.conf -M 1 >proxy.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          python3 - <<'PY'
          import socket,time
          for host in ('::1',):
              for attempt in range(20):
                  try:
                      with socket.create_connection((host,20443),timeout=1): pass
                      print(f'TCP listener reachable: {host}:20443')
                      break
                  except OSError:
                      if attempt == 19:
                          print(open('proxy.log').read())
                          raise
                      time.sleep(1)
          try:
              with socket.create_connection(('127.0.0.1',20443),timeout=2): pass
          except ConnectionRefusedError:
              print('IPv4 loopback refused as required')
          else:
              raise AssertionError('IPv4 client connection unexpectedly accepted')
          PY
