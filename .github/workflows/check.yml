name: Check installer
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash -n install.sh
      - run: shellcheck --severity=warning install.sh
      - run: bash -n tests/ui.sh && shellcheck --severity=warning tests/ui.sh
      - run: bash tests/ui.sh
  official-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        debian: ['12', '13']
    container:
      image: debian:${{ matrix.debian }}
      options: --ulimit nofile=131072:131072 --sysctl net.ipv6.conf.all.disable_ipv6=0
    steps:
      - run: apt-get update && apt-get install -y --no-install-recommends git ca-certificates build-essential libssl-dev zlib1g-dev curl python3 openssl
      - uses: actions/checkout@v4
      - name: Compile official pinned source
        shell: bash
        run: |
          set -euo pipefail
          commit=$(sed -n 's/^UPSTREAM_COMMIT=//p' install.sh)
          git clone --no-checkout https://github.com/TelegramMessenger/MTProxy.git /tmp/official-source
          git -C /tmp/official-source checkout --detach "$commit"
          make -C /tmp/official-source -j2 CC='gcc -fcommon'
          test -x /tmp/official-source/objs/bin/mtproto-proxy
      - name: Verify IPv4 listener and IPv6 refusal
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/official-source
          curl -fLsS --retry 3 https://core.telegram.org/getProxySecret -o proxy-secret
          curl -fLsS --retry 3 https://core.telegram.org/getProxyConfig -o proxy-multi.conf
          objs/bin/mtproto-proxy -u nobody -p 18888 -H 20443 -S "$(openssl rand -hex 16)" --aes-pwd proxy-secret proxy-multi.conf -M 1 >proxy.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          python3 - <<'PY'
          import socket,time
          for host in ('127.0.0.1',):
              for attempt in range(20):
                  try:
                      with socket.create_connection((host,20443),timeout=1): pass
                      print(f'TCP listener reachable: {host}:20443')
                      break
                  except OSError:
                      if attempt == 19:
                          print(open('proxy.log').read())
                          raise
                      time.sleep(1)
          try:
              with socket.create_connection(('::1',20443),timeout=2): pass
          except ConnectionRefusedError:
              print('IPv6 loopback refused as required')
          else:
              raise AssertionError('IPv6 client connection unexpectedly accepted')
          PY


  alpine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and smoke test on Alpine 3.22
        run: |
          docker run --rm --ulimit nofile=131072:131072 \
            -v "$PWD:/repo:ro" alpine:3.22 sh -ec '
              apk add --no-cache bash git curl build-base linux-headers openssl-dev zlib-dev openssl ca-certificates python3
              cd /repo
              bash -n install.sh
              bash install.sh --preview
              git clone --no-checkout https://github.com/TelegramMessenger/MTProxy.git /tmp/source
              git -C /tmp/source checkout --detach "$(sed -n "s/^UPSTREAM_COMMIT=//p" install.sh)"
              sed -n "/^prepare_musl_source()/,/^}/p" install.sh > /tmp/musl.sh
              bash -c ". /tmp/musl.sh; prepare_musl_source /tmp/source"
              cd /tmp/source
              make -j2 CC="gcc -fcommon"
              curl -fLsS --retry 3 https://core.telegram.org/getProxySecret -o proxy-secret
              curl -fLsS --retry 3 https://core.telegram.org/getProxyConfig -o proxy-multi.conf
              objs/bin/mtproto-proxy -u nobody -p 18888 -H 20443 -S "$(openssl rand -hex 16)" --aes-pwd proxy-secret proxy-multi.conf -M 1 >proxy.log 2>&1 &
              for attempt in 1 2 3 4 5; do
                if python3 -c "import socket; socket.create_connection((\"127.0.0.1\",20443),2).close()"; then exit 0; fi
                sleep 1
              done
              cat proxy.log
              exit 1
            '
